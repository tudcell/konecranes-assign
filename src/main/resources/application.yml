server:
  port: 8080

spring:
  mvc:
    async:
      request-timeout: 1800000  # 30 minutes - prevents Spring from killing long-lived SSE connections

simulation:
  sse:
    emitter-timeout-millis: 0  # 0 = never timeout (connection lives until client closes)
  world:
    width: 1000
    height: 700
  gateway:
    host: 127.0.0.1
    port: 9090
  scheduler:
    fixedDelayMillis: 150
  vehicle:
    jarPath: target/konecranes-ai-sim-1.0.0.jar
    defaultSpeed: 60.0
    tickMillis: 100
    spawnMinDistance: 100.0
    spawnMaxAttempts: 50
    reconnectMaxAttempts: 8
    reconnectInitialBackoffMillis: 500
    reconnectMaxBackoffMillis: 5000
    tuning:
      maxTurnDegPerTick: 8.0
      manualOverrideHoldMillis: 2000
      aiTurnDeltaDeg: 8.0
      aiSlowDownFactor: 0.90
      aiRecoveryFactor: 1.08
      aiPredictionSteps: 20
      aiPredictionStepSeconds: 0.10
      aiKeepCourseRiskThreshold: 0.12
      safetyEmergencyMargin: 3.0
      safetyEmergencyLookaheadSeconds: 0.08
      safetyHardStopFactor: 0.25
      safetySoftBrakeFactor: 0.80
      safetySoftBrakeMinimumSpeed: 20.0
      stuckDistanceThreshold: 1.0
      stuckTimeMillis: 2000
      stuckEscapeSpeedFactor: 1.5
