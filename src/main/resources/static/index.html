<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konecranes AI Vehicle Simulation</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="layout">
    <section class="panel controls">
        <h1>Konecranes AI Vehicle Simulation</h1>
        <div class="group">
            <label for="spawnCount">Vehicles to spawn</label>
            <input id="spawnCount" type="number" min="1" max="25" value="3">
            <button id="spawnButton">Spawn</button>
        </div>

        <div class="group">
            <label for="vehicleSelect">Vehicle</label>
            <select id="vehicleSelect"></select>
        </div>

        <div class="group">
            <label for="directionInput">Direction (degrees)</label>
            <input id="directionInput" type="number" min="0" max="359" value="90">
            <button id="directionButton">Set Direction</button>
        </div>

        <div class="group">
            <label for="speedInput">Speed</label>
            <input id="speedInput" type="number" min="0" step="1" value="60">
            <button id="speedButton">Set Speed</button>
        </div>

        <div class="group status-grid">
            <div><span class="label">Vehicles</span><span id="vehicleCount">0</span></div>
            <div><span class="label">High Risk</span><span id="warningCount">0</span></div>
            <div><span class="label">Updated</span><span id="updatedAt">-</span></div>
        </div>
    </section>

    <section class="panel canvas-panel">
        <canvas id="simCanvas" width="1000" height="700"></canvas>
    </section>
</div>
<script src="/app.js"></script>
</body>
</html>
